goal: |
  Improve classification accuracy by tuning train_config.yaml.
  Tune preprocessing, model choice and hyperparameters.

gates:
  - pytest test_train.py -v

observe:
  - name: pipeline
    command: bash run_pipeline.sh
    capture:
      - output/eval_results.json
    metrics:
      accuracy: higher

scope:
  editable: [train_config.yaml]

agent:
  timeout: 2m

budget:
  iterations: 5
