# Bin packing: pack items into as few bins as possible. No finish line —
# the agent keeps improving until the per-iteration time budget stops it.
goal: |
  Find the best packing of the items in instance.json into as few bins as
  possible without exceeding capacity, and write it to solution.json as
  {"bins": [[item indices], ...]}. The baseline puts one item per bin (300 bins).

constraints:
  - python score.py --check   # feasibility gate: valid packing

metrics:
  - command: python score.py
    values:
      bins: lower

scope:
  editable: [solution.json]   # instance.json + score.py are frozen by omission

agent:
  type: claude

budget:
  iterations: 4
  iteration_time: 5m          # hard per-iteration deadline; the time-left hook
                              # tells the agent how long is left so it can wrap
                              # up and write notes before being killed
