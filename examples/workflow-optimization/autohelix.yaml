goal: |
  Optimize the LLM workflow in workflow.py.
  Use captured results/report.json execution traces to guide improvements.
  Keep changes general; do not hardcode benchmark cases or expected answers.

gates:
  - pytest -q
  - python benchmark.py --mock
  - metric: task_success_rate
    regress: 20%

observe:
  - name: bench
    command: python benchmark.py
    timeout: 15m
    capture:
      - results/report.json
    metrics:
      task_success_rate: higher
      avg_tokens: lower

scope:
  editable:
    - workflow.py
    - prompt.md
    - SKILL.md

agent:
  timeout: 10m

budget:
  iterations: 2
