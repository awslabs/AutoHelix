<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280">
  <defs>
    <style>
      .box-label { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .box-sub { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 10.5px; fill: #8b949e; }
      .state-item { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 11.5px; fill: #8b949e; }
      .state-primary { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .outcome { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 600; }
      .annotation { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 10px; fill: #484f58; }
      .arrow { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ah-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#484f58"/>
    </marker>
    <marker id="ah-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3fb950"/>
    </marker>
    <marker id="ah-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#f85149"/>
    </marker>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="280" rx="8" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="819" height="279" rx="7.5" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- ═══ Left: Persistent state (no title) ═══ -->
  <rect x="40" y="75" width="125" height="120" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="103" y="101" text-anchor="middle" class="state-primary">Project</text>
  <line x1="58" y1="111" x2="147" y2="111" stroke="#30363d" stroke-width="0.5"/>
  <text x="103" y="132" text-anchor="middle" class="state-item">goal</text>
  <text x="103" y="152" text-anchor="middle" class="state-item">notes</text>
  <text x="103" y="172" text-anchor="middle" class="state-item">history</text>

  <!-- Arrow: state → agent -->
  <line x1="165" y1="140" x2="225" y2="140" class="arrow" stroke="#58a6ff" marker-end="url(#ah-blue)"/>

  <!-- ═══ Middle: Iteration ═══ -->

  <!-- Box: Agent works -->
  <rect x="235" y="105" width="180" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="325" y="132" text-anchor="middle" class="box-label">Agent works on task</text>
  <text x="325" y="149" text-anchor="middle" class="box-sub">write code, train a model,</text>
  <text x="325" y="163" text-anchor="middle" class="box-sub">run experiments…</text>
  <!-- Annotation: worktree -->
  <text x="325" y="93" text-anchor="middle" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="11px" fill="#8b949e">fresh git worktree · editable files only</text>

  <!-- Arrow: agent → checks -->
  <line x1="415" y1="140" x2="465" y2="140" class="arrow" stroke="#484f58" marker-end="url(#ah-gray)"/>

  <!-- Box: Checks -->
  <rect x="475" y="100" width="170" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="560" y="131" text-anchor="middle" class="box-label">Constraints pass?</text>
  <text x="560" y="147" text-anchor="middle" class="box-label">Metrics OK?</text>
  <text x="560" y="166" text-anchor="middle" class="box-sub">capture metrics + artifacts</text>

  <!-- ═══ Right: Outcomes ═══ -->

  <!-- Arrow: yes → accept -->
  <line x1="645" y1="122" x2="695" y2="122" class="arrow" stroke="#3fb950" marker-end="url(#ah-green)"/>
  <text x="705" y="118" class="outcome" fill="#3fb950">accept</text>
  <text x="705" y="132" class="box-sub">project updated</text>

  <!-- Arrow: no → discard -->
  <line x1="645" y1="158" x2="695" y2="158" class="arrow" stroke="#f85149" marker-end="url(#ah-red)"/>
  <text x="705" y="154" class="outcome" fill="#f85149">discard</text>
  <text x="705" y="168" class="box-sub">project unchanged</text>

  <!-- ═══ Loop-back: results feed back into state ═══ -->
  <path d="M 720,178 L 720,240 L 103,240 L 103,200"
        class="arrow" stroke="#58a6ff" marker-end="url(#ah-blue)"/>
  <text x="420" y="255" text-anchor="middle" font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="10.5px" fill="#58a6ff">notes + history always updated</text>
</svg>
