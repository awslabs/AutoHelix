<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 572" width="880" height="572">
  <defs>
    <style>
      .code { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; }
      .key { fill: #7dd3fc; }
      .val { fill: #d1d5db; }
      .str { fill: #86efac; }
      .comment { fill: #6b7280; }
      .punct { fill: #9ca3af; }
      .label { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 600; fill: #e6edf3; }
      .desc { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; font-size: 10.5px; fill: #8b949e; }
      .connector { stroke: #30363d; stroke-width: 1; fill: none; }
      .dot { fill: #484f58; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="572" rx="8" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="879" height="571" rx="7.5" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Code panel (left) -->

  <!-- goal section -->
  <text x="28" y="40" class="code" xml:space="preserve"><tspan class="key">goal</tspan><tspan class="punct">:</tspan><tspan class="str"> |</tspan></text>
  <text x="42" y="56" class="code str">Optimize the data pipeline for throughput</text>
  <text x="42" y="72" class="code str">while maintaining correctness on all inputs.</text>

  <!-- gates section -->
  <text x="28" y="104" class="code" xml:space="preserve"><tspan class="key">gates</tspan><tspan class="punct">:</tspan></text>
  <text x="42" y="120" class="code" xml:space="preserve"><tspan class="punct">-</tspan><tspan class="str"> pytest tests/ -x</tspan></text>
  <text x="42" y="136" class="code" xml:space="preserve"><tspan class="punct">-</tspan><tspan class="str"> mypy src/ --strict</tspan></text>
  <text x="42" y="152" class="code" xml:space="preserve"><tspan class="punct">-</tspan><tspan class="key"> metric</tspan><tspan class="punct">:</tspan><tspan class="str"> throughput</tspan></text>
  <text x="56" y="168" class="code" xml:space="preserve"><tspan class="key">regress</tspan><tspan class="punct">:</tspan><tspan class="val"> 5%</tspan></text>

  <!-- observe section -->
  <text x="28" y="200" class="code" xml:space="preserve"><tspan class="key">observe</tspan><tspan class="punct">:</tspan></text>
  <text x="42" y="216" class="code" xml:space="preserve"><tspan class="punct">-</tspan><tspan class="key"> name</tspan><tspan class="punct">:</tspan><tspan class="str"> bench</tspan></text>
  <text x="56" y="232" class="code" xml:space="preserve"><tspan class="key">command</tspan><tspan class="punct">:</tspan><tspan class="str"> python benchmark.py</tspan></text>
  <text x="56" y="248" class="code" xml:space="preserve"><tspan class="key">timeout</tspan><tspan class="punct">:</tspan><tspan class="val"> 30m</tspan></text>
  <text x="56" y="264" class="code" xml:space="preserve"><tspan class="key">metrics</tspan><tspan class="punct">:</tspan></text>
  <text x="70" y="280" class="code" xml:space="preserve"><tspan class="key">throughput</tspan><tspan class="punct">:</tspan><tspan class="str"> higher</tspan></text>
  <text x="70" y="296" class="code" xml:space="preserve"><tspan class="key">latency_p99</tspan><tspan class="punct">:</tspan><tspan class="str"> lower</tspan></text>
  <text x="56" y="312" class="code" xml:space="preserve"><tspan class="key">capture</tspan><tspan class="punct">:</tspan><tspan class="val"> [results/profile.json]</tspan></text>
  <text x="42" y="328" class="code" xml:space="preserve"><tspan class="punct">-</tspan><tspan class="key"> name</tspan><tspan class="punct">:</tspan><tspan class="str"> review</tspan></text>
  <text x="56" y="344" class="code" xml:space="preserve"><tspan class="key">review</tspan><tspan class="punct">:</tspan><tspan class="str"> What is the most important next fix?</tspan></text>

  <!-- scope section -->
  <text x="28" y="376" class="code" xml:space="preserve"><tspan class="key">scope</tspan><tspan class="punct">:</tspan></text>
  <text x="42" y="392" class="code" xml:space="preserve"><tspan class="key">editable</tspan><tspan class="punct">:</tspan><tspan class="val"> [src/pipeline/, src/transforms/]</tspan></text>

  <!-- agent section -->
  <text x="28" y="424" class="code" xml:space="preserve"><tspan class="key">agent</tspan><tspan class="punct">:</tspan></text>
  <text x="42" y="440" class="code" xml:space="preserve"><tspan class="key">backend</tspan><tspan class="punct">:</tspan><tspan class="str"> claude</tspan></text>
  <text x="42" y="456" class="code" xml:space="preserve"><tspan class="key">model</tspan><tspan class="punct">:</tspan><tspan class="str"> claude-opus-4-8</tspan></text>
  <text x="42" y="472" class="code" xml:space="preserve"><tspan class="key">timeout</tspan><tspan class="punct">:</tspan><tspan class="str"> 30m</tspan></text>

  <!-- budget section -->
  <text x="28" y="504" class="code" xml:space="preserve"><tspan class="key">budget</tspan><tspan class="punct">:</tspan></text>
  <text x="42" y="520" class="code" xml:space="preserve"><tspan class="key">iterations</tspan><tspan class="punct">:</tspan><tspan class="val"> 10</tspan></text>
  <text x="42" y="536" class="code" xml:space="preserve"><tspan class="key">cost</tspan><tspan class="punct">:</tspan><tspan class="val"> 30</tspan></text>
  <text x="42" y="552" class="code" xml:space="preserve"><tspan class="key">time</tspan><tspan class="punct">:</tspan><tspan class="str"> 4h</tspan></text>

  <!-- Annotation panel (right) — all lines are horizontal -->

  <!-- Goal annotation -->
  <line x1="460" y1="56" x2="530" y2="56" class="connector"/>
  <circle cx="530" cy="56" r="2.5" class="dot"/>
  <text x="542" y="48" class="label">Goal</text>
  <text x="542" y="63" class="desc">What the agent should achieve. Natural language;</text>
  <text x="542" y="77" class="desc">the first line is the run's title.</text>

  <!-- Gates annotation -->
  <line x1="240" y1="136" x2="530" y2="136" class="connector"/>
  <circle cx="530" cy="136" r="2.5" class="dot"/>
  <text x="542" y="121" class="label">Gates</text>
  <text x="542" y="136" class="desc">Anything that can reject an iteration. Commands</text>
  <text x="542" y="150" class="desc">must exit 0; a metric gate compares a number with</text>
  <text x="542" y="164" class="desc">the last accepted iteration. Rejected code never lands.</text>

  <!-- Observe annotation -->
  <line x1="275" y1="280" x2="530" y2="280" class="connector"/>
  <circle cx="530" cy="280" r="2.5" class="dot"/>
  <text x="542" y="258" class="label">Observe</text>
  <text x="542" y="273" class="desc">Run after the gates. Output and captured files go</text>
  <text x="542" y="287" class="desc">to the next agent; metrics marked higher/lower are</text>
  <text x="542" y="301" class="desc">the run's numbers. A review is a read-only LLM's</text>
  <text x="542" y="315" class="desc">feedback. Failures are recorded, not rejected.</text>

  <!-- Scope annotation -->
  <line x1="420" y1="392" x2="530" y2="392" class="connector"/>
  <circle cx="530" cy="392" r="2.5" class="dot"/>
  <text x="542" y="388" class="label">Scope</text>
  <text x="542" y="403" class="desc">Paths the agent may modify. Changes elsewhere</text>
  <text x="542" y="417" class="desc">are discarded, and the agent is told.</text>

  <!-- Agent annotation -->
  <line x1="225" y1="448" x2="530" y2="448" class="connector"/>
  <circle cx="530" cy="448" r="2.5" class="dot"/>
  <text x="542" y="444" class="label">Agent</text>
  <text x="542" y="459" class="desc">Backend: claude, codex, or opencode. Model, and a</text>
  <text x="542" y="473" class="desc">per-iteration timeout with time-left hints.</text>

  <!-- Budget annotation -->
  <line x1="175" y1="536" x2="530" y2="536" class="connector"/>
  <circle cx="530" cy="536" r="2.5" class="dot"/>
  <text x="542" y="528" class="label">Budget</text>
  <text x="542" y="543" class="desc">When to stop: iteration count, total wall-clock,</text>
  <text x="542" y="557" class="desc">or max USD spend.</text>
</svg>
