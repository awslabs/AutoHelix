name: Publish to PyPI

# Publishes the built package to PyPI using PyPI Trusted Publishing (OIDC) —
# no long-lived API token is stored in the repository. Every publish is gated
# behind the `pypi` GitHub Environment, which is configured with a required
# reviewer, so a human must approve each release before it is uploaded.
#
# Triggers:
#   - a published GitHub Release (the normal path: tag a release, approve, ship)
#   - manual "Run workflow" (workflow_dispatch), e.g. the first name-reservation
#     upload or re-running after a failure
#
# Setup this workflow depends on (one-time, done in the web UI):
#   1. GitHub → Settings → Environments → new environment named `pypi`,
#      add yourself under "Required reviewers".
#   2. PyPI → the project's Publishing settings → add a Trusted Publisher:
#        Owner: awslabs   Repository: AutoHelix
#        Workflow: publish.yml   Environment: pypi
#      (PyPI supports "pending" publishers, so this can be registered before
#       the project exists — the first successful publish creates it.)

on:
  release:
    types: [published]
  workflow_dispatch:

# The workflow only reads the repo; no write scopes needed here.
permissions:
  contents: read

jobs:
  test:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,examples]"

      - name: Run fast tests
        run: pytest -m "not slow"

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match package version {expected!r}"
              )
          PY

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/autohelix-wheel
          /tmp/autohelix-wheel/bin/python -m pip install dist/*.whl
          /tmp/autohelix-wheel/bin/autohelix --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The human-approval gate: this environment has a required reviewer, so the
    # job pauses until someone approves it in the Actions UI.
    environment:
      name: pypi
      url: https://pypi.org/p/autohelix
    # OIDC token for Trusted Publishing — this is what authenticates to PyPI
    # in place of a stored API token.
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
